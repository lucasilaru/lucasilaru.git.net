    <script>
        
        // Helper function to extract Google Drive file ID & format viewable URL
        function getDriveDirectUrl(driveUrl, fallbackUrl) {
            if (!driveUrl) return fallbackUrl;
            const match = driveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                // Returns Google Drive Direct Image link
                return `https://lh3.googleusercontent.com/u/0/d/${match[1]}`;
            }
            return fallbackUrl;
        }

        // Image Sources with Floral Fallback Options in case Drive Links require Permission
        const fallbackBride = "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=600&q=80";
        const fallbackGroom = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80";
        const fallbackHero = "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80";

        const rawHero = "https://drive.google.com/file/d/138oNHFNjW5WO5gSm5yTO5Wx7NDZ2VHuO/view?usp=drivesdk";
        const rawBride = "https://drive.google.com/file/d/1ismR-tok_1fhWcwVoxzG6gAof2vhenVP/view?usp=drivesdk";
        const rawGroom = "https://drive.google.com/file/d/15o0qL6Ay7G-9TP6qsQ4P7I4vcS0eBTGc/view?usp=drivesdk";

        const rawGallery = [
            "https://drive.google.com/file/d/1101hTgxaIAP9xN3IrwFRthtUnrxCZ19z/view?usp=drivesdk",
            "https://drive.google.com/file/d/1DUpUSPPpSrp0-LpWOxCd6pAqLiYLG5Uz/view?usp=drivesdk",
            "https://drive.google.com/file/d/1qeosQcWua3lh2vxEaEjHWs-CQOADopgp/view?usp=drivesdk",
            "https://drive.google.com/file/d/1CVFIjYRRDR1kS4DZ05-1FSEtJZZfhayk/view?usp=drivesdk",
            "https://drive.google.com/file/d/138oNHFNjW5WO5gSm5yTO5Wx7NDZ2VHuO/view?usp=drivesdk",
            "https://drive.google.com/file/d/1kYZAjup4WLIVdLkbn2n07oIPGhudx6Ni/view?usp=drivesdk"
        ];

        // Setup Images on Load
        window.addEventListener('DOMContentLoaded', () => {
            // Read Guest Name from URL parameter (?to=Nama+Tamu)
            const urlParams = new URLSearchParams(window.location.search);
            const guestName = urlParams.get('to') || urlParams.get('nama');
            if (guestName) {
                document.getElementById('guest-name').innerText = guestName;
                document.getElementById('guest-input-name').value = guestName;
            }

            // Set images with direct URLs & fallbacks
            const coverBg = document.getElementById('cover-bg');
            const heroBg = document.getElementById('hero-bg');
            const brideImg = document.getElementById('bride-img');
            const groomImg = document.getElementById('groom-img');

            const heroUrl = getDriveDirectUrl(rawHero, fallbackHero);
            coverBg.style.backgroundImage = `url('${heroUrl}')`;
            heroBg.style.backgroundImage = `url('${heroUrl}')`;

            brideImg.src = getDriveDirectUrl(rawBride, fallbackBride);
            brideImg.onerror = () => { brideImg.src = fallbackBride; };

            groomImg.src = getDriveDirectUrl(rawGroom, fallbackGroom);
            groomImg.onerror = () => { groomImg.src = fallbackGroom; };

            // Render Gallery
            const galleryGrid = document.getElementById('gallery-grid');
            const fallbackGallery = [
                "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=600&q=80",
                "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=600&q=80",
                "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=600&q=80",
                "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=600&q=80",
                "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=600&q=80",
                "https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&fit=crop&w=600&q=80"
            ];

            rawGallery.forEach((url, idx) => {
                const directUrl = getDriveDirectUrl(url, fallbackGallery[idx]);
                const card = document.createElement('div');
                card.className = "relative group overflow-hidden rounded-2xl shadow-md cursor-pointer h-48 sm:h-64";
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', (idx * 50).toString());
                card.onclick = () => openLightbox(directUrl);

                card.innerHTML = `
                    <img src="${directUrl}" onerror="this.src='${fallbackGallery[idx]}'" class="w-full h-full object-cover transform transition duration-500 group-hover:scale-110" alt="Gallery ${idx+1}">
                    <div class="absolute inset-0 bg-sage-900/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
                        <i class="fa-solid fa-magnifying-glass-plus text-2xl"></i>
                    </div>
                `;
                galleryGrid.appendChild(card);
            });

            // Initialize AOS
            AOS.init({
                duration: 800,
                once: true,
                easing: 'ease-in-out'
            });

            // Start Countdown Timer
            initCountdown();
        });

        let isPlaying = false;
        const bgMusic = document.getElementById('bg-music');

        function openInvitation() {
            const cover = document.getElementById('welcome-cover');
            const mainContent = document.getElementById('main-content');
            const audioControl = document.getElementById('audio-control');

            cover.classList.add('opacity-0');
            setTimeout(() => {
                cover.style.display = 'none';
                mainContent.classList.remove('opacity-0');
                audioControl.classList.remove('hidden');
                // Refresh AOS animations
                AOS.refresh();
            }, 1000);

            // Play background music
            playAudio();
        }

        function playAudio() {
            bgMusic.play().then(() => {
                isPlaying = true;
                updateAudioIcon();
            }).catch(e => {
                console.log("Autoplay hindered:", e);
            });
        }

        function toggleAudio() {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play();
                isPlaying = true;
            }
            updateAudioIcon();
        }

        function updateAudioIcon() {
            const icon = document.getElementById('audio-icon');
            if (isPlaying) {
                icon.className = "fa-solid fa-music animate-spin";
            } else {
                icon.className = "fa-solid fa-pause";
            }
        }

        function initCountdown() {
            const targetDate = new Date("2026-12-13T09:30:00").getTime();

            const timer = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    clearInterval(timer);
                    document.getElementById('days').innerText = "00";
                    document.getElementById('hours').innerText = "00";
                    document.getElementById('minutes').innerText = "00";
                    document.getElementById('seconds').innerText = "00";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days < 10 ? '0' + days : days;
                document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
            }, 1000);
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            const copyText = document.getElementById('copy-text');
            copyText.innerText = "Berhasil Disalin!";
            setTimeout(() => {
                copyText.innerText = "Salin Nomor Rekening";
            }, 2000);
        }

        let wishCount = 2;
        function submitRSVP(e) {
            e.preventDefault();
            const name = document.getElementById('guest-input-name').value;
            const status = document.getElementById('guest-status').value;
            const message = document.getElementById('guest-message').value;

            if(!name || !status || !message) return;

            const container = document.getElementById('wishes-container');
            const newWish = document.createElement('div');
            newWish.className = "glass-card p-4 rounded-2xl border border-sage-200 shadow-sm transition transform duration-500 scale-95 opacity-0";
            
            newWish.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="font-semibold text-sm text-sage-900">${escapeHtml(name)}</span>
                    <span class="text-[10px] text-xs bg-sage-100 text-sage-700 px-2 py-0.5 rounded-full">${status}</span>
                </div>
                <p class="text-xs text-gray-600 italic">"${escapeHtml(message)}"</p>
            `;

            container.insertBefore(newWish, container.firstChild);
            
            // Animation effect
            setTimeout(() => {
                newWish.classList.remove('scale-95', 'opacity-0');
            }, 50);

            wishCount++;
            document.getElementById('wishes-count').innerText = `${wishCount} Ucapan`;

            // Reset Form
            document.getElementById('rsvp-form').reset();

            // Custom Notification replacing alert()
            const btn = e.target.querySelector('button');
            const origText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> Terkirim!`;
            btn.classList.replace('bg-sage-600', 'bg-emerald-600');
            setTimeout(() => {
                btn.innerHTML = origText;
                btn.classList.replace('bg-emerald-600', 'bg-sage-600');
            }, 2500);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
```
